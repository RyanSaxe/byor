<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 352" role="img" aria-label="byor sync data flow. Global configuration under ~/.config/byor/ (rules, commands, packages, config.yml) and repository files under .byor/ (project, local, config.yml, local.yml) feed into byor sync, which resolves precedence (project > local > package > global) and writes scoped mirrors and sgconfig.yml. Those outputs power editor and terminal ast-grep, agent hooks (agent-check and command-check), and optional committed pre-commit and CI gates.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3;text-anchor:middle;font-size:15.5px}
.t{font-weight:600}.s{font-size:13px;fill:#9198a1}
.line{fill:none;stroke:#e6edf3;stroke-width:1.5}.head{fill:#e6edf3}
.bline{fill:none;stroke:#6e8cf0;stroke-width:1.5}.bhead{fill:#6e8cf0}
.box{fill:#0d1117;stroke:#3d444d}.round{fill:#152042;stroke:#6e8cf0}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker>
</defs>
<rect class="box" x="24" y="20" width="368" height="82" rx="10"/>
<text x="208" y="49" class="t">Global (~/.config/byor/)</text>
<text x="208" y="70" class="s">rules · commands · packages · config.yml</text>
<text x="208" y="88" class="s">personal rules shared across repositories</text>
<rect class="box" x="428" y="20" width="368" height="82" rx="10"/>
<text x="612" y="49" class="t">Repository (.byor/)</text>
<text x="612" y="70" class="s">project · local · config.yml · local.yml</text>
<text x="612" y="88" class="s">committed team policy + repo-local exclusions</text>
<path class="line" d="M208 102 V136" marker-end="url(#a)"/>
<path class="line" d="M612 102 V136" marker-end="url(#a)"/>
<rect class="round" x="24" y="140" width="772" height="68" rx="10"/>
<text x="410" y="168" class="t">byor sync → scoped mirrors &amp; sgconfig.yml</text>
<text x="410" y="191" class="s">precedence: project &gt; local &gt; package &gt; global · self-heals on commands &amp; hooks</text>
<path class="bline" d="M134 208 V246" marker-end="url(#b)"/>
<path class="bline" d="M410 208 V246" marker-end="url(#b)"/>
<path class="bline" d="M686 208 V246" marker-end="url(#b)"/>
<rect class="box" x="24" y="250" width="220" height="82" rx="10"/>
<text x="134" y="280" class="t">Editor &amp; terminal</text>
<text x="134" y="301" class="s">ast-grep lsp · ast-grep scan</text>
<text x="134" y="319" class="s">reads sgconfig.yml + .ignore</text>
<rect class="box" x="300" y="250" width="220" height="82" rx="10"/>
<text x="410" y="280" class="t">Agent hooks</text>
<text x="410" y="301" class="s">agent-check · command-check</text>
<text x="410" y="319" class="s">AST rules + checks + commands</text>
<rect class="box" x="576" y="250" width="220" height="82" rx="10"/>
<text x="686" y="280" class="t">Optional team gate</text>
<text x="686" y="301" class="s">.pre-commit-config.yaml</text>
<text x="686" y="319" class="s">byor-gate.yml (byor init --gate)</text>
</svg>
