<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 364" role="img" aria-label="byor agent feedback loops. In the post-edit feedback loop, after an agent edits a file, byor agent-check runs ast-grep and extra checks scoped to edited lines: a clean scan exits 0 silently so the agent continues, while findings return agent_prompt instructions and check output so the agent fixes the edit. In the pre-command gate, before an agent runs a shell command, byor command-check evaluates Bash rules and command_checks: allowed commands exit 0 silently and execute, while matches return a deny JSON with a reason so the agent rewrites the command.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3;text-anchor:middle;font-size:15.5px}
.t{font-weight:600}.s{font-size:13px;fill:#9198a1}
.k{font-size:11.5px;font-weight:600;fill:#9198a1;text-anchor:start;letter-spacing:0.06em}
.line{fill:none;stroke:#e6edf3;stroke-width:1.5}.head{fill:#e6edf3}
.bline{fill:none;stroke:#6e8cf0;stroke-width:1.5}.bhead{fill:#6e8cf0}
.div{stroke:#30363d;stroke-width:1}
.box{fill:#0d1117;stroke:#3d444d}.round{fill:#152042;stroke:#6e8cf0}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker>
</defs>
<text x="24" y="26" class="k">POST-EDIT FEEDBACK</text>
<rect class="box" x="24" y="38" width="196" height="76" rx="10"/>
<text x="122" y="69" class="t">Agent edits file</text>
<text x="122" y="91" class="s">Write · Edit · apply_patch</text>
<path class="line" d="M220 76 H268" marker-end="url(#a)"/>
<rect class="round" x="272" y="38" width="256" height="76" rx="10"/>
<text x="400" y="64" class="t">byor agent-check</text>
<text x="400" y="84" class="s">ast-grep + extra checks</text>
<text x="400" y="101" class="s">scoped to edited lines</text>
<path class="line" d="M528 76 H596" marker-end="url(#a)"/>
<text x="562" y="67" class="s">clean</text>
<rect class="box" x="600" y="38" width="196" height="76" rx="10"/>
<text x="698" y="69" class="t">Agent continues</text>
<text x="698" y="91" class="s">exit 0, silent</text>
<path class="bline" d="M400 114 V142 H122 V118" marker-end="url(#b)"/>
<text x="261" y="160" class="s">diagnostics → agent_prompt + check output (agent fixes edit)</text>
<line class="div" x1="24" y1="184" x2="796" y2="184"/>
<text x="24" y="210" class="k">PRE-COMMAND GATE</text>
<rect class="box" x="24" y="222" width="196" height="76" rx="10"/>
<text x="122" y="253" class="t">Agent runs command</text>
<text x="122" y="275" class="s">Bash · run_command</text>
<path class="line" d="M220 260 H268" marker-end="url(#a)"/>
<rect class="round" x="272" y="222" width="256" height="76" rx="10"/>
<text x="400" y="248" class="t">byor command-check</text>
<text x="400" y="268" class="s">Bash rules + command_checks</text>
<text x="400" y="285" class="s">zero-cost fast path</text>
<path class="line" d="M528 260 H596" marker-end="url(#a)"/>
<text x="562" y="251" class="s">allow</text>
<rect class="box" x="600" y="222" width="196" height="76" rx="10"/>
<text x="698" y="253" class="t">Command executes</text>
<text x="698" y="275" class="s">exit 0, silent</text>
<path class="bline" d="M400 298 V326 H122 V302" marker-end="url(#b)"/>
<text x="261" y="344" class="s">deny JSON + reason → agent rewrites command</text>
</svg>
