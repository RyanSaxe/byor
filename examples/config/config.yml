# A global byor config (~/.config/byor/config.yml). This is where byor goes
# beyond plain ast-grep: it forwards read-only diagnostics from external linters
# and craft scripts into the same agent loop as your rules, and gates shell
# commands before they run. byor reads this file and never writes it, so it can
# live in a dotfiles repo; machine state lives in ~/.local/state/byor/.
version: 1

paths:
  rules: rules # global file rules live in ~/.config/byor/rules/
  packages: packages # opt-in rule/check bundles; `byor package add <name>`
  commands: commands # global Bash command rules live in ~/.config/byor/commands/
  repos: repos.yml # registry of repos byor syncs global rules into, in ~/.local/state/byor/

ast_grep:
  command: auto # use the bundled ast-grep; set a path to override

output:
  concise: true # one line per diagnostic, easiest for agents to parse
  # max_diagnostics: 10 # cap rendered diagnostics, noting "... and N more"; default unlimited

init:
  # Opt-in packages enabled automatically when you run `byor init`.
  packages:
    - craft

worktrees:
  # Copy every git-ignored file, such as .env, from the main checkout into a new
  # worktree, not only byor's. Default false. A large ignored folder makes the
  # first copy slow, including inside an agent hook.
  copy_ignored: false

# `checks` run alongside ast-grep rules. Prefer read-only linter forwarding
# (`gate: false`) in your global config: hooks steer the agent immediately
# without mutating files underneath it, while each repository keeps its own CI
# and pre-commit hooks as the source of truth.
checks:
  - name: ruff
    extensions:
      - py
      - pyi
    run: ~/.config/byor/scripts/ruff-readonly.sh
    gate: false
    tags:
      - format
      - lint
  - name: ty
    extensions:
      - py
      - pyi
    run: uvx ty check --output-format concise
    gate: false
    tags:
      - strict
  # Agent-only steering checks (`gate: false`): the post-edit hook runs them,
  # but generated pre-commit/CI gates leave them out.
  - name: dependency-gate
    extensions:
      - toml
    run: ~/.config/byor/scripts/dependency-gate.sh
    gate: false
  - name: suppression-reason
    extensions:
      - py
      - pyi
      - ts
      - tsx
      - js
      - jsx
    run: ~/.config/byor/scripts/check-suppression-reason.py
    gate: false
    tags:
      - craft

# `command_checks` are the pre-command gate's script escape hatch: byor pipes
# the shell command an agent is about to run to the script's stdin, and a
# nonzero exit denies it — the output becomes the agent's correction. Keep them
# fast (well under ~100ms): no network, no heavy interpreter startup. Prefer a
# `language: Bash` command *rule* when a pattern can express the policy; reach
# for a script only when the decision needs runtime state (see protect-ssh.sh).
command_checks:
  - name: protect-ssh
    run: ~/.config/byor/scripts/protect-ssh.sh
    tags:
      - commands

# Profiles are named templates for repo-local exclusions. Tag names are yours;
# these are only examples.
profiles:
  existing:
    description: Low-friction defaults for mature repositories.
    rules:
      excluded_tags:
        - legacy-risk
      excluded_rule_ids: []
    checks:
      excluded_tags:
        - strict
      excluded: []
