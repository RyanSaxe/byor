# Demonstrates: a design-craft nudge (`severity: info`). Instead of banning
# `monkeypatch` outright, this rule asks the agent to justify attribute
# patching while leaving environment and directory helpers (`setenv`, `delenv`,
# `chdir`) completely untouched.
id: python.question-monkeypatch
language: Python
severity: info
message: Verify monkeypatch.setattr/delattr is necessary instead of passing a dependency.
rule:
  any:
    - pattern: monkeypatch.setattr($$$ARGS)
    - pattern: monkeypatch.delattr($$$ARGS)
metadata:
  byor:
    rationale: >
      Patching attributes in place couples tests to private import paths and
      module internals. Environment and directory helpers (setenv, delenv,
      chdir) are safe boundaries and are not flagged.
    agent_prompt: >
      Prefer passing a fake, callable, or protocol as an argument instead of
      patching module internals. Keep monkeypatch.setattr or monkeypatch.delattr
      only when crossing a boundary you cannot inject, and add
      `# ast-grep-ignore: python.question-monkeypatch` on the line above with a
      short comment explaining why.
    tags:
      - python
      - testing
