# Demonstrates: enforcing packaging hygiene. Agents often reach for
# `sys.path.insert(0, ...)` or `sys.path.append(...)` to silence an import
# error instead of fixing package installation or script metadata.
id: python.no-sys-path-mutation
language: Python
severity: error
message: Do not mutate `sys.path` at runtime.
rule:
  any:
    - pattern: sys.path.append($$$ARGS)
    - pattern: sys.path.insert($$$ARGS)
    - pattern: sys.path.extend($$$ARGS)
    - pattern: sys.path += $EXPR
metadata:
  byor:
    rationale: >
      Mutating sys.path hides broken packaging, confuses type checkers, and
      makes imports depend on execution order and working directory.
    agent_prompt: >
      Install the package in editable mode (`uv sync` / `uv run`) or declare
      script dependencies with PEP 723 metadata instead of editing sys.path.
    tags:
      - python
      - packaging
